name: Antigravity Update Compatibility Report
description: Report a new Antigravity Desktop version that changed dist/utils.js or selectors
labels: [compatibility]
body:
  - type: input
    id: antigravity_version
    attributes:
      label: Antigravity Desktop version
      placeholder: e.g. 2.35.0
    validations:
      required: true
  - type: textarea
    id: doctor_output
    attributes:
      label: Output of `node src/patcher.mjs doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Which selector stopped aligning RTL or which error code appeared?
