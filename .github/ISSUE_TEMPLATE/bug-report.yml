name: Error / Bug Report
description: Report a patcher, launcher, or RTL rendering error (attach Diagnose output)
labels: [bug]
body:
  - type: input
    id: antigravity_version
    attributes:
      label: Antigravity Desktop version
      placeholder: e.g. 2.32.0
    validations:
      required: true
  - type: input
    id: error_code
    attributes:
      label: Error code printed (if any)
      placeholder: e.g. ANCHOR_NOT_FOUND, PERMISSION_DENIED, FILE_LOCKED
  - type: textarea
    id: doctor_output
    attributes:
      label: Output of Diagnose-Antigravity-RTL.bat (or `node src/patcher.mjs doctor`)
      render: text
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: Describe what you ran and what went wrong. Do not include personal chats or tokens.
