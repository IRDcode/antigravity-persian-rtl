name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --omit=dev
      - run: npm test
      - name: Check PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('launch-antigravity.ps1', 'launch-all-mods.ps1')) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file`: $($_.ToString())" }
              exit 1
            }
          }
